{% extends "base.html" %}

{% block title %}Patient Registration | MediCare Hospital{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container form-shell">
        <div class="form-card">
            <span class="section-label">Patient Registration</span>
            <h1>Create Patient Account</h1>
            <form method="POST" class="app-form">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="Enter patient name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter email address" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create password" required>

                <button type="submit" class="primary-btn full-width">Register as Patient</button>
            </form>
            <p class="form-link">Already registered? <a href="{{ url_for('patient_login') }}">Login here</a></p>
        </div>
    </div>
</section>
{% endblock %}
